<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новая задача — TaskFlow</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="logo">✔</span> TaskFlow</div>
    <span class="sep">/</span>
    <span class="board-name">Релиз мобильного приложения</span>
  </div>
</div>

<div class="wrap">
  <a class="h-back" href="board.html">← К доске</a>
  <h1 style="font-size:24px;margin:6px 0 18px">Новая задача</h1>

  <form action="board.html">
    <div class="panel">
      <div class="field">
        <label>Название</label>
        <input value="Добавить экспорт отчёта в PDF" required>
      </div>
      <div class="field">
        <label>Описание</label>
        <textarea rows="3" placeholder="Что нужно сделать">Пользователь должен иметь возможность выгрузить отчёт за месяц в PDF из раздела «Статистика».</textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>Колонка</label>
          <select>
            <option>Backlog</option>
            <option>In Progress</option>
            <option>Review</option>
            <option>Done</option>
          </select>
        </div>
        <div class="field">
          <label>Исполнитель</label>
          <select>
            <option>Не назначен</option>
            <option selected>Мадина К.</option>
            <option>Арман Б.</option>
            <option>Дамир С.</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Срок</label>
          <input type="date" value="2026-08-28">
        </div>
        <div class="field">
          <label>Приоритет</label>
          <select>
            <option>Низкий</option>
            <option selected>Средний</option>
            <option>Высокий</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Метки</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="pick-label on c-blue">Фича</span>
          <span class="pick-label c-red">Баг</span>
          <span class="pick-label on c-green">UI</span>
          <span class="pick-label c-orange">Срочно</span>
          <span class="pick-label c-teal">Бэкенд</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary">Создать задачу</button>
      <a href="board.html"><button type="button" class="btn-ghost">Отмена</button></a>
    </div>
  </form>
</div>
</body>
</html>
